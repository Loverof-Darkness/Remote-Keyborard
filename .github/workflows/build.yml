name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Bluetooth HID compile stub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/stubs /tmp/hid-stubs-classes
          javac \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d /tmp/hid-stubs-classes \
            app/stubs-src/android/bluetooth/BluetoothHidDevice.java \
            app/stubs-src/android/bluetooth/BluetoothHidDeviceAppSdpSettings.java \
            app/stubs-src/android/bluetooth/BluetoothHidDeviceAppQosSettings.java
          jar cf app/stubs/hidden-android.jar -C /tmp/hid-stubs-classes .

      - name: Build optimized release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign optimized release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/remote-keyboard.keystore"
          ALIAS="remote-keyboard"
          PASS="android"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Remote Keyboard, OU=Build, O=Loverof-Darkness, L=NA, ST=NA, C=IN"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --ks-key-alias "$ALIAS" \
            --out "$APK" \
            "$ALIGNED"
          rm -f "$ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Report APK size
        shell: bash
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/*.apk
          du -h app/build/outputs/apk/release/app-release.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-keyboard-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
