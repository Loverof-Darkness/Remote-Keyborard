name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Bluetooth HID compile stub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/stubs /tmp/hid-stubs-classes
          javac \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d /tmp/hid-stubs-classes \
            app/stubs-src/android/bluetooth/BluetoothHidDevice.java \
            app/stubs-src/android/bluetooth/BluetoothHidDeviceAppSdpSettings.java \
            app/stubs-src/android/bluetooth/BluetoothHidDeviceAppQosSettings.java
          jar cf app/stubs/hidden-android.jar -C /tmp/hid-stubs-classes .

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-keyboard-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
